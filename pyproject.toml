[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-agent"
version = "0.1.0"
description = "Multi-agent system that walks the AI infrastructure lifecycle and surfaces sole-source/majority-supplier investment opportunities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankit Talwar" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "duckduckgo-search>=5.3",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-generativeai>=0.7",
    "streamlit>=1.36",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-recording>=0.13",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
investment-agent = "investment_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
