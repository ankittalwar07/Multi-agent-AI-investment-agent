name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline tests (mock LLM, no keys)
        run: pytest -q
      - name: Validate dashboard data
        run: python scripts/validate_site_data.py
      - name: Check dashboard script syntax
        run: node --check docs/app.js
