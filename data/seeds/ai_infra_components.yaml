description: |
  Curated taxonomy of AI-infrastructure components and known incumbents, ordered
  roughly from the silicon end of the stack up to the application layer. Used as
  a prior by the Decomposer agent so it doesn't have to reinvent the taxonomy
  every run. The Decomposer may add new components (with justification) but must
  not silently drop seeded ones.

components:
  # --- Tier 0: Raw materials & utilities (the upstream supply chain) ---
  - name: Copper
    category: raw_materials
    description: Refined copper for datacenter power distribution, busways, and grid buildout. AI capex is the swing factor for global copper demand.
    incumbents: [Freeport-McMoRan, Southern Copper, BHP, Antofagasta]
    notes: AI datacenter buildout adds 1-2 million tons of incremental copper demand by 2030.
    why_it_matters: |
      AI datacenters need ~5 tons of copper per megawatt of compute — for the
      busways inside the building, the transformers stepping voltage down from
      the grid, and the transmission lines bringing power in. A single GW-scale
      datacenter campus consumes ~30,000 tons.

      By 2030, AI capex adds **1-2 million tons of incremental annual copper
      demand** — on top of the EV / grid-electrification demand that was
      already tightening the market. New copper mines take 15-20 years from
      discovery to first production, so supply is geologically constrained.
      **Copper is the most leveraged commodity exposure to the AI buildout.**

  - name: Rare Earths & Specialty Metals
    category: raw_materials
    description: Neodymium, gallium, germanium, palladium, and other specialty metals required for chip fabrication and motors.
    incumbents: [MP Materials, Lynas, China Northern Rare Earth, Iluka]
    notes: China controls >85% of refining capacity; Western diversification is a regulatory tailwind.
    why_it_matters: |
      Neodymium magnets drive every hard-disk drive and electric motor in a
      datacenter. Gallium and germanium are core inputs to power semiconductors
      that step voltage down for GPU racks. Palladium plates chip leads.

      **China refines >85% of the world's rare earths** and has begun restricting
      gallium and germanium exports as a retaliatory lever against US chip-export
      controls. US Department of Defense Title III funding has made domestic
      refining a national-security mandate — MP Materials and Lynas trade as
      the cleanest Western exposures.

  - name: Industrial Gases
    category: raw_materials
    description: Ultra-pure nitrogen, helium, neon, and specialty gases consumed during semiconductor fabrication.
    incumbents: [Linde, Air Products, Air Liquide, Taiyo Nippon Sanso]
    notes: Long-term contracts; high barriers to entry; oligopolistic structure.

  - name: Specialty Semiconductor Chemicals
    category: raw_materials
    description: Photoresists, CMP slurries, wet chemicals, and high-purity silicon wafers for chip fabs.
    incumbents: [Shin-Etsu Chemical, JSR Corp, Tokyo Ohka Kogyo, Entegris, Versum]
    notes: Photoresist supply is concentrated in Japan; export controls add geopolitical risk.

  - name: Chip Substrates (ABF)
    category: raw_materials
    description: Ajinomoto Build-up Film (ABF) substrates that connect AI accelerator dies to PCBs.
    incumbents: [Ibiden, Unimicron, Shinko Electric, Nan Ya PCB]
    notes: Sole-source bottleneck on ABF chemistry (Ajinomoto); package substrate capacity is tight.

  - name: Datacenter Water Infrastructure
    category: facilities
    description: Cooling water systems, reuse, and treatment infrastructure for hyperscale facilities.
    incumbents: [Xylem, Pentair, Evoqua, Ecolab]
    notes: Water scarcity is becoming a siting constraint; closed-loop systems are a regulatory tailwind.

  # --- Tier 1: Semiconductor capex & manufacturing ---
  - name: EUV Lithography
    category: semiconductor_capex
    description: Extreme-ultraviolet lithography scanners required for <=5nm logic and advanced DRAM.
    incumbents: [ASML, Carl Zeiss SMT, Cymer]
    notes: ASML is effectively sole-source for EUV scanners; Zeiss SMT is sole-source for the optics.
    why_it_matters: |
      Modern chips have features smaller than 5 nanometers — smaller than the
      COVID virus. To etch features that small you need 13.5nm extreme-ultraviolet
      light, generated by zapping tin droplets with a 50,000-degree-Celsius laser
      inside a vacuum chamber the size of a bus. Then you focus that light through
      mirrors so flat they're accurate to a single atom.

      **ASML is the only company on Earth that can build this machine.** Each one
      costs ~$200M and takes 4 planes to ship. Without ASML, modern AI chips
      literally cannot be manufactured — NVIDIA, AMD, TSMC, Samsung, Intel all
      depend on a single Dutch company. Carl Zeiss SMT is the sole-source for
      the mirrors; Cymer (owned by ASML) is the sole-source for the light source.

      **The clearest sole-source moat in the AI value chain.**

  - name: Leading-edge Foundry
    category: semiconductor_manufacturing
    description: <=3nm logic wafer fabrication.
    incumbents: [TSMC, Samsung Foundry, Intel Foundry]
    notes: TSMC has >90% share at the leading edge.
    why_it_matters: |
      Designing a chip and manufacturing one are completely different businesses.
      NVIDIA designs GPUs; **TSMC actually makes them.** A 3nm fab costs $20B+ to
      build, takes 4 years to bring up, and requires the world's most advanced
      EUV equipment. TSMC has been doing this longer and better than anyone.

      At the leading edge (3nm and below), **TSMC has >90% share.** Samsung is
      a distant second; Intel is trying to catch up with the 18A node. If TSMC's
      Hsinchu fabs went offline tomorrow — geopolitical event, earthquake — the
      entire AI buildout would stop. This concentration risk is also why the
      US CHIPS Act is funding TSMC Arizona and Intel Foundry — diversification
      is a regulatory tailwind.

  - name: Advanced Packaging (CoWoS / SoIC)
    category: semiconductor_manufacturing
    description: 2.5D / 3D packaging that bonds logic dies to HBM stacks. The binding constraint on NVIDIA shipments.
    incumbents: [TSMC, ASE, Amkor]
    notes: TSMC CoWoS capacity is the binding constraint on NVIDIA shipments.
    why_it_matters: |
      Once you have an NVIDIA GPU die AND HBM memory stacks made, you have to
      physically bond them together — thousands of micron-scale connections on
      a silicon "interposer" the size of a postage stamp. TSMC's CoWoS
      (Chip-on-Wafer-on-Substrate) is the only process that does this at scale,
      reliably, at the volumes NVIDIA needs.

      **TSMC CoWoS capacity is the literal binding constraint on how many
      H100/H200/B200 GPUs NVIDIA can ship every quarter.** It is the reason
      lead times have stretched to 6+ months. TSMC is doubling CoWoS capacity
      every year, but demand is growing faster. ASE and Amkor are credible
      alternatives gaining share.

  # --- Tier 2: Silicon ---
  - name: AI Training GPUs (Merchant Silicon)
    category: compute_silicon
    description: General-purpose GPUs sold on the open market for training frontier models. The market-clearing price for AI compute.
    incumbents: [NVIDIA, AMD]
    notes: NVIDIA holds ~85-90% share; CUDA software lock-in is the deepest moat.
    why_it_matters: |
      GPUs were invented to render 3D video game graphics — thousands of tiny math
      cores doing parallel arithmetic. It turns out training a neural network is the
      same workload: massive parallel matrix multiplications.

      NVIDIA's real moat isn't the silicon — it's CUDA, the software layer they
      released in 2007. Every AI researcher on Earth has 15+ years of CUDA muscle
      memory. Switching to AMD ROCm or anything else means rewriting the foundation
      of your stack. AMD's catch-up is real but slow.

      **The investment angle**: NVIDIA is priced for perfection but earnings
      revisions keep grinding higher. AMD is the credible #2 with valuation room
      to re-rate as ROCm matures and hyperscalers diversify supply.

  - name: Hyperscaler Custom Silicon (TPUs/ASICs)
    category: compute_silicon
    description: Vertically-integrated AI accelerators designed in-house by hyperscalers to escape the NVIDIA GPU tax.
    incumbents: [Google TPU, AWS Trainium, AWS Inferentia, Microsoft Maia, Meta MTIA]
    notes: Captive silicon — value accrues to parent stocks (GOOGL/AMZN/MSFT/META), not as a separate revenue line.
    why_it_matters: |
      Google ($30B+/yr on NVIDIA), Amazon, Microsoft, and Meta each pay NVIDIA a
      "GPU tax" so large they decided to design their own chips. Custom silicon
      isn't a side project — it's a structural cost-of-goods war.

      **Google TPU is the most mature.** Now in v5p (training) and v5e (inference);
      Gemini is trained entirely on TPU; Anthropic trains Claude on TPU via GCP.
      AWS Trainium2 and Microsoft Maia 100 are ~2 years behind but ramping.
      Meta's MTIA is even earlier — internal-only for ranking/recommendation today.

      **Two ways to play it:**

      **A. The hidden-asset thesis (GOOGL long).** Alphabet's PE multiple is
      modeled as a search-ads business. The market doesn't credit TPU as a
      separate business line — yet TPU likely saves Google $10B+ per year in
      avoided NVIDIA spend AND already generates external revenue via Cloud TPU
      rental (Anthropic, plus growing list). You're getting an AI-accelerator
      business worth tens of billions for free inside GOOGL. AWS Trainium and
      MSFT Maia follow the same logic, earlier in the curve.

      **B. The bear-flag for NVIDIA.** Every dollar of hyperscaler compute that
      shifts to in-house silicon is a dollar NVIDIA loses. By 2027, custom
      silicon could be 15-25% of hyperscaler AI compute — each percentage point
      is ~$3-5B of NVDA revenue. This is the cleanest counterweight to a
      crowded NVDA long.

  - name: High-Bandwidth Memory (HBM)
    category: memory
    description: Stacked DRAM colocated with AI accelerators on the same package. The actual bottleneck on AI accelerator shipments.
    incumbents: [SK Hynix, Samsung, Micron]
    notes: Three-supplier oligopoly; SK Hynix leads HBM3E; entire 2026 production is sold out.
    why_it_matters: |
      LLM inference isn't compute-bound — it's **memory-bandwidth bound**. For
      each token a model generates, the GPU must read every model parameter from
      memory. A 70B-parameter model = 140GB of data the GPU has to fetch per
      token. Regular DDR5 RAM moves data at ~50 GB/sec — far too slow to keep a
      GPU busy.

      HBM is the answer: DRAM dies stacked vertically (8 or 12 high) sitting
      directly next to the GPU on the same silicon package, connected by a
      "silicon interposer" with thousands of microscopic wires. HBM3E moves data
      at **~5,000 GB/sec — 100x faster than DDR5**.

      **This is the actual bottleneck on NVIDIA shipments today.** Not the GPU
      die — TSMC could make more of those. The constraint is HBM supply +
      CoWoS packaging capacity to bond it. Only three companies on Earth make
      HBM (SK Hynix is far ahead), and 2026 HBM4 production is already sold out
      to NVIDIA, AMD, and the hyperscalers. **SK Hynix is a clean, mispriced
      derivative of the AI buildout** that trades in Korea.

  - name: Datacenter Networking Silicon
    category: networking
    description: Switch ASICs and SmartNICs that interconnect AI training clusters.
    incumbents: [Broadcom, NVIDIA (Mellanox), Marvell]
    why_it_matters: |
      An AI training run for a frontier model uses 10,000+ GPUs working in
      lockstep. They communicate as much as they compute — every training step
      requires synchronizing gradients across the entire cluster. Network
      latency = idle GPUs = burned dollars.

      Broadcom's Tomahawk switches and NVIDIA's InfiniBand (Mellanox acquisition)
      are how terabytes-per-second move between GPU racks. **Networking is now
      10-15% of every NVIDIA system bill** — and Broadcom captures most of the
      non-NVIDIA share, making it one of the cleanest pure-play AI infrastructure
      stocks without the NVIDIA crowding risk.

  - name: Optical Interconnect / Transceivers
    category: networking
    description: 800G/1.6T optical modules and co-packaged optics for rack-to-rack AI traffic.
    incumbents: [Coherent, Lumentum, Innolight, Eoptolink]
    why_it_matters: |
      At rack-to-rack distances inside a datacenter (10-100 meters), copper
      signaling can't carry 800Gbps/1.6Tbps without melting. So you convert
      electrical → light → electrical with optical transceivers. **Each NVIDIA
      H100 needs ~6-8 transceivers**; a single H100 cluster can consume
      hundreds of thousands.

      Coherent and Lumentum make the lasers; Innolight and Eoptolink assemble
      modules. Co-packaged optics (CPO) — putting lasers directly inside the
      switch chip — is the next leap. **Pure-play AI exposure with less hype
      premium than the GPU names.**

  - name: Inference Hardware Startups
    category: compute_silicon
    description: Non-NVIDIA accelerators optimized specifically for inference (token generation) rather than training.
    incumbents: [Groq, Cerebras, SambaNova, Tenstorrent]
    why_it_matters: |
      Training a model is a one-time expense; serving it (inference) is a
      forever expense. Inference workloads are simpler than training and don't
      need NVIDIA's flexibility — they need raw throughput per dollar. That
      opens space for specialized chips that beat GPUs on cost-per-token.

      Groq's LPU streams tokens at 500+/sec (5-10x faster than NVIDIA H100 on
      Llama 70B). Cerebras builds wafer-scale chips. **Most are private**, so
      retail exposure is limited, but they're the optionality on a future where
      NVIDIA doesn't keep all of inference.

  - name: Edge / On-Device Inference
    category: compute_silicon
    description: Mobile and embedded NPUs for on-device model inference.
    incumbents: [Qualcomm, Apple Neural Engine, Hailo, MediaTek]

  # --- Tier 3: Datacenter facilities ---
  - name: Datacenter Power & Cooling
    category: facilities
    description: PDUs, busways, liquid cooling, immersion cooling for high-density AI racks. Power has overtaken GPU supply as the bottleneck.
    incumbents: [Vertiv, Schneider Electric, Eaton]
    why_it_matters: |
      A single NVIDIA H100 GPU draws ~700W under load. A modern AI rack draws
      100kW — **10x what a normal server rack draws.** Existing datacenters
      cannot air-cool this density. You need direct-to-chip liquid cooling or
      full immersion cooling, plus high-amperage busways and PDUs that
      conventional datacenters were never engineered for.

      Vertiv, Schneider, and Eaton make the equipment that retrofits old
      facilities and equips the new ones. **Power availability has now
      overtaken GPU supply as the binding constraint on AI datacenter
      buildouts** — the US grid simply cannot add 50GW of new load fast
      enough. These three names are the pickaxe play on that constraint.

  # --- Tier 4: Compute platforms ---
  - name: Hyperscale Cloud
    category: compute_platform
    description: Public cloud infrastructure offering large-scale GPU clusters. Spending $200B+/yr collective on AI capex.
    incumbents: [AWS, Microsoft Azure, Google Cloud, Oracle Cloud]
    why_it_matters: |
      AWS, Azure, GCP rent H100 capacity at $2-5/hour and run 60-80% gross
      margins doing it. AI is the biggest single demand driver they have ever
      seen — Azure AI revenue doubled YoY, AWS Bedrock is reaccelerating.

      **The dilemma**: they are spending $200B+ per year collective on AI
      capex, most of it on NVIDIA chips that lose value fast. The 3-year
      payback math depends on AI workload demand staying durable through 2027.
      MSFT is the cleanest direct-AI cloud beneficiary; GOOGL is the
      cheapest on PE; AMZN is the cleanest re-acceleration story.

  - name: GPU Neoclouds
    category: compute_platform
    description: Pure-play GPU-rental clouds — bought H100s early, sign long-term contracts with frontier labs.
    incumbents: [CoreWeave, Lambda, Crusoe, Nebius]
    why_it_matters: |
      Pure-play GPU rental — CoreWeave, Lambda, Crusoe, Nebius — bought H100s
      at the right time and signed multi-year, take-or-pay contracts with the
      frontier labs (OpenAI on CoreWeave, etc.) at premium rates.

      **The opportunity**: capex efficiency is much higher than hyperscalers
      because they don't carry legacy datacenter overhead. **The risk**:
      highly leveraged, single-product, and the moat is access to NVIDIA
      allocation — which can be revoked. High-beta way to play the AI
      buildout; binary outcomes.

  # --- Tier 5: Models ---
  - name: Foundation Model Labs
    category: model_layer
    description: Labs training the frontier general-purpose models that everything else runs on.
    incumbents: [OpenAI, Anthropic, Google DeepMind, Meta AI, xAI, Mistral]
    why_it_matters: |
      OpenAI, Anthropic, Google DeepMind, Meta, xAI are the labs training the
      frontier models that everything in the stack ultimately serves. These
      are application-layer companies that capture most of the visible AI
      revenue — but spend almost as much on compute as they earn.

      **The investment dilemma**: most are private (OpenAI, Anthropic, xAI),
      capital-intensive, and frontier models commoditize fast as open weights
      catch up. **Most retail exposure is indirect**: MSFT (49% of OpenAI
      economics), GOOGL (DeepMind + Gemini), META (Llama as a defensive moat
      around the social stack).

  # --- Tier 6: Data & Tooling ---
  - name: Vector Databases
    category: data_layer
    description: Embedding stores for retrieval-augmented generation.
    incumbents: [Pinecone, Weaviate, Qdrant, Chroma]

  - name: LLM Observability
    category: tooling
    description: Tracing, evaluation, and monitoring for LLM applications.
    incumbents: [LangSmith, Arize, Weights & Biases, Braintrust]

  - name: Data Labeling / RLHF
    category: data_layer
    description: Human-in-the-loop annotation and preference data for model training.
    incumbents: [Scale AI, Surge, Labelbox]

  - name: Agent Frameworks
    category: tooling
    description: Open-source orchestration libraries for LLM agent applications.
    incumbents: [LangChain, LlamaIndex, CrewAI]

  - name: Synthetic Data
    category: data_layer
    description: Generated training data for model pretraining and fine-tuning.
    incumbents: [Gretel, Mostly AI, Tonic]
